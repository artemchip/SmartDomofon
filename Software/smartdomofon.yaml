# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: smartdomofon
  friendly_name: SmartDomofon

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: "epnGpXm4uf3qHlRCHCSu0PvYEWQLfs79qbeFElhciZw="
  reboot_timeout: 0s
  max_connections: 1

ota:
  - platform: esphome
    password: !secret smartdomofon__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: SmartDomofon
    password: mypartyno2
    ap_timeout: 90s
  fast_connect: true
  reboot_timeout: 0s
  power_save_mode: NONE

captive_portal:
  id: captive
  compression: gzip

external_components:
  - source: custom_components

domofon:
  id: d1
  call_detect_pin: 14
  sw_open_pin: 33
  sw_down_pin: 32
  amp_sw_pin: 27
  audible_call: true
  call_accept_delay: 1200ms
  audio1_before_play_delay: 200ms
  audio1_after_play_delay: 100ms
  audio2_before_play_delay: 500ms
  before_hangup_delay: 500ms
  call_processing_sensor_id: my_call_processing_sensor
  
web_server:
  port: 80
  version: 3
  local: true
  compression: gzip

switch:
  - platform: template
    name: "Озвучивать вызов"
    restore_mode: ALWAYS_ON
    lambda: |-
      return id(d1).get_audible_call();
    turn_on_action:
      - lambda: |-
          id(d1).set_audible_call(true);
    turn_off_action:
      - lambda: |-
          id(d1).set_audible_call(false);

number:
  - platform: template
    id: call_accept_delay_ms
    name: "Сколько мс ждать перед ответом на вызов"
    lambda: |-
      return id(d1).get_call_accept_delay();
    min_value: 500
    max_value: 5000
    step: 50
    mode: SLIDER
    set_action:
      - lambda: |-
          id(d1).set_call_accept_delay(x);
  - platform: template
    id: audio1_before_play_delay_ms
    name: "Задержка до аудио 1, мс"
    lambda: |-
      return id(d1).get_audio1_before_play_delay();
    min_value: 100
    max_value: 5000
    step: 50
    mode: SLIDER
    set_action:
      - lambda: |-
          id(d1).set_audio1_before_play_delay(x);
  - platform: template
    id: audio1_after_play_delay_ms
    name: "Задержка после аудио 1, мс"
    lambda: |-
      return id(d1).get_audio1_after_play_delay();
    min_value: 100
    max_value: 5000
    step: 50
    mode: SLIDER
    set_action:
      - lambda: |-
          id(d1).set_audio1_after_play_delay(x);
  - platform: template
    id: audio2_before_play_delay_ms
    name: "Задержка до аудио 2, мс"
    lambda: |-
      return id(d1).get_audio2_before_play_delay();
    min_value: 300
    max_value: 5000
    step: 50
    mode: SLIDER
    set_action:
      - lambda: |-
          id(d1).set_audio2_before_play_delay(x);
  - platform: template
    id: before_hangup_delay_ms
    name: "Задержка перед завершением вызова, мс"
    lambda: |-
      return id(d1).get_before_hangup_delay();
    min_value: 200
    max_value: 5000
    step: 50
    mode: SLIDER
    set_action:
      - lambda: |-
          id(d1).set_before_hangup_delay(x);
binary_sensor:
  - platform: template
    id: my_call_processing_sensor
    name: "Вызов сейчас обрабатывается"
    lambda: |-
      return id(d1).get_call_processing();
    icon: "mdi:phone"

http_request:
  timeout: 5s
  redirect_limit: 3
  buffer_size_rx: 32768

text:
  - platform: template
    name: "URL аудио 1"
    id: audio1_url
    optimistic: true
    min_length: 0
    max_length: 100
    mode: text
    on_value:
      - http_request.get:
          url: !lambda |-
            return x;
          capture_response: true
          max_response_buffer_size: 16384
          collect_headers:
            - Content-Type
          on_response:
            then:
              - lambda: |-
                  id(d1).set_audio_raw(0, response->status_code, response->get_response_header("Content-Type"), body);
          on_error:
            then:
              - lambda: |-
                  id(d1).set_audio_raw(0, -1, "", "");
  - platform: template
    name: "URL аудио 2"
    id: audio2_url
    optimistic: true
    min_length: 0
    max_length: 100
    mode: text
    on_value:
      - http_request.get:
          url: !lambda |-
            return x;
          capture_response: true
          max_response_buffer_size: 16384
          collect_headers:
            - Content-Type
          on_response:
            then:
              - lambda: |-
                  id(d1).set_audio_raw(1, response->status_code, response->get_response_header("Content-Type"), body);
          on_error:
            then:
              - lambda: |-
                  id(d1).set_audio_raw(1, -1, "", "");

button:
  - platform: template
    name: "Сброс"
    on_press:
      then:
        - lambda: |-
            App.reboot();
  - platform: template
    name: "Тест"
    on_press:
      then:
        - lambda: |-
            id(d1).emulate_call();